{{- /*
This template persists JWT and other secrets between upgrades.

Priority order:
  1. Static values from .Values.sessionSecret (required for ArgoCD and any other
     GitOps tool that renders with `helm template`, where `lookup` has no cluster
     access and silently returns empty)
  2. Existing secret via lookup (works with plain helm upgrade)
  3. Random generation (first install only)
*/ -}}

{{- if not .Values.externalSecrets.enabled }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "session-secret") }}

{{- $jwt := "" }}
{{- $session := "" }}
{{- $csrf := "" }}

{{- if and .Values.sessionSecret .Values.sessionSecret.jwt }}
  {{- $jwt = .Values.sessionSecret.jwt }}
  {{- $session = .Values.sessionSecret.session }}
  {{- $csrf = .Values.sessionSecret.csrf }}
{{- else if $existing }}
  {{- $jwt = index $existing.data "jwt_encode" | b64dec }}
  {{- $session = index $existing.data "session_secret" | b64dec }}
  {{- $csrf = index $existing.data "wtf_csrf_secret" | b64dec }}
{{- else }}
  {{- $jwt = printf "string:%s" (randAlphaNum 43) }}
  {{- $session = randAlphaNum 43 }}
  {{- $csrf = randAlphaNum 32 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: session-secret
type: Opaque
stringData:
  jwt_encode: {{ $jwt | quote }}
  jwt_decode: {{ $jwt | quote }}
  session_secret: {{ $session | quote }}
  wtf_csrf_secret: {{ $csrf | quote }}
{{- end }}
